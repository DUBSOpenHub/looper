name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, sys

          lines = pathlib.Path("skills/looper/SKILL.md").read_text(encoding="utf-8").splitlines()
          if not lines or lines[0].strip() != "---":
              print("::error file=skills/looper/SKILL.md::Missing frontmatter start (---)")
              sys.exit(1)
          try:
              end = lines[1:60].index("---") + 1
          except ValueError:
              print("::error file=skills/looper/SKILL.md::Missing frontmatter end (---)")
              sys.exit(1)
          front = "\n".join(lines[1:end])
          if "name: looper" not in front or "description:" not in front:
              print("::error file=skills/looper/SKILL.md::Frontmatter must define name: looper and a description")
              sys.exit(1)
          print("✅ Frontmatter valid")
          PY

      - name: Bash syntax
        run: |
          /bin/bash -n skills/looper/scripts/pass-ledger.sh
          /bin/bash -n quickstart.sh

      - name: ShellCheck
        run: shellcheck skills/looper/scripts/pass-ledger.sh quickstart.sh

      - name: Self-tests
        working-directory: skills/looper
        run: python3 -B scripts/test_pass_ledger.py -v

      - name: Quickstart installs from a local checkout
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          bash quickstart.sh
          for f in SKILL.md scripts/pass-ledger.sh scripts/test_pass_ledger.py templates/state.md; do
            cmp "skills/looper/$f" "$HOME/.copilot/skills/looper/$f"
          done
          echo "✅ Installed skill matches the repository copy"
